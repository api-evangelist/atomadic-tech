apis:
- name: AAAA Nexus API
  description: >-
    Pay-per-call REST API for autonomous agents: threat scoring, trust and reputation oracles,
    escrow, SLA bonds, agent registry and discovery, swarm messaging, RatchetGate sessions,
    identity/UCAN/delegation, EU AI Act compliance certificates, drift certification, verified
    randomness, text and LLM inference. 149 operations under /v1, metered in micro-USDC via x402
    (Base L2) or an X-API-Key credit pack; 3 free trial calls per paid endpoint per day.
  image: https://atomadic.tech/logo.png
  humanURL: https://atomadic.tech/quickstart
  baseURL: https://atomadic.tech
  x-base-url-note: >-
    repair-api-bases.py flags this as marketing-base-present because the API host equals the
    website root. Verified live 2026-09-19: the apex IS the API origin — GET https://atomadic.tech/health
    and /v1/oracle/entropy answer application/json 200, POST /v1/threat/score answers a 402 x402
    challenge, and the provider's own OpenAPI servers[] names https://atomadic.tech. No api.
    subdomain exists (api.atomadic.tech does not resolve). Left as-is on purpose.
  tags:
  - AI Agents
  - Security
  - Trust
  - Escrow
  - Compliance
  - x402
  - Inference
