- Inference
- Cryptography
apis:
- name: Atomadic MCP Server
  description: >-
    Entitlement-gated hosted Model Context Protocol server (atomadic-mcp 0.6.9) at mcp.atomadic.tech:
    68 tools across agents, compliance, DeFi, escrow, identity, inference, ratchet, reputation, RNG, SLA,
    swarm, text, threat and trust families, plus polyglot code emitters. tools/list is open without a
    key; tools/call needs a Bearer ato_ entitlement key sold as monthly suites. Sibling servers at atomadic.tech/mcp
    (44 tools, x402/API key), nexus.atomadic.tech/mcp (25) and fuse.atomadic.tech/mcp (gated).
  image: https://atomadic.tech/logo.png
