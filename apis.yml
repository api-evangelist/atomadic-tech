aid: atomadic-tech
name: Atomadic Tech
description: >-
  Atomadic Tech operates AAAA-Nexus, an "agent control plane" for autonomous AI agents: a
  149-operation REST API on atomadic.tech covering security and threat scoring, trust and reputation
  oracles, agent-to-agent escrow, SLA enforcement, EU AI Act compliance checks, agent discovery,
  verified randomness, RatchetGate session security and LLM inference, priced per call in USDC
  through the x402 protocol on Base L2 or by prepaid API-key credit packs. The company also ships an
  A2A agent card, four hosted MCP servers (mcp.atomadic.tech, atomadic.tech/mcp, nexus. and fuse.)
  sold as entitlement-keyed monthly suites, an llms.txt, and Python and TypeScript SDKs.
image: https://atomadic.tech/logo.png
url: https://raw.githubusercontent.com/api-evangelist/atomadic-tech/refs/heads/main/apis.yml
x-type: company
x-source: harvest:a2a-registry
x-tier: profiled
x-tier-reason: enrichment pass 2026-09-19 (was stub)
specificationVersion: '0.20'
created: '2026-09-19'
modified: '2026-09-19'
tags:
- Company
- AI Agents
- Agent Infrastructure
- MCP
- A2A
- x402
- Payments
