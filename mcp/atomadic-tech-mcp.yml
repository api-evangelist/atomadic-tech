summary: >-
  Atomadic ships FOUR hosted MCP surfaces and one stdio package, all under its own domain. The
  primary is mcp.atomadic.tech ("atomadic-mcp" 0.6.9, entitlement-gated by a Bearer ato_ key,
  tools/list open without a key); the REST product's own server sits at atomadic.tech/mcp
  ("aaaa-nexus", API-key or x402 per tool, free tools open); two product hosts (nexus., fuse.) run
  their own servers. tools/list is anonymous on three of the four, so the full inputSchema of 137
  tools was captured — no fallback to llms.txt was needed.
