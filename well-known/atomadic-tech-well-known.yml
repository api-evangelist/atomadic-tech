method: probed
source: live probes of /.well-known/ on every Atomadic host on 2026-09-19 (apex, www, mcp.atomadic.tech, fuse.atomadic.tech, nexus.atomadic.tech, invest.atomadic.tech)
summary: >-
  The apex host is unusually rich: RFC 9116 security.txt, an A2A agent card at BOTH the canonical
  /.well-known/agent-card.json and the legacy /.well-known/agent.json (byte-identical), an
  ai-plugin.json, an MCP discovery manifest, a machine-readable x402 price manifest, and a document
  at /.well-known/oauth-protected-resource. The MCP host (mcp.atomadic.tech) answers 405 to every
  standard RFC 8414 / RFC 9728 path but serves four provider-specific documents (issuer public key,
  Ed25519-signed closure receipt, state-of-truth, interlock). No OIDC discovery, no RFC 8414
  authorization-server metadata and no /.well-known/api-catalog exist on any host.
pointer_basis: >-
  WellKnown pointer emitted on the strength of the seven 200s carrying real JSON/text documents on
  atomadic.tech. SecurityTxt pointer emitted for the served RFC 9116 file (Contact, Expires
  2027-01-01, Preferred-Languages, Canonical — no Policy line).
rfc9728_note: >-
  /.well-known/oauth-protected-resource returns 200 JSON but the body is NOT RFC 9728 shaped: it
  carries `resource`, `scopes_supported` [api:read, api:write] and `bearer_methods_supported`
  [header] (all RFC 9728 members) but NO `authorization_servers`, and adds provider-specific keys
  (api_key_header X-API-Key, x402_payment, mcp_plugin, documentation). It is a hybrid
  discovery document; conformance/ records it as partial. No authorization server exists to
  discover — the API is API-key + x402, not OAuth.
false_positive_watch: >-
  invest.atomadic.tech answers HTTP 200 text/html (21,198 bytes, the same landing page) for EVERY
  /.well-known/* path and for /openapi.json. Those 200s are recorded below as misses. Also: on the
  very first request of the session the apex served ANOTHER TENANT's documents (an "Agent Health
  Monitor API" OpenAPI, a "Claix" agent card and a "Cymetica / EventTrader" homepage) before settling
  on Atomadic's own content on every subsequent fetch (10+ re-fetches over ~20 minutes, with and
  without a browser UA). Every saved file below was re-fetched and checked for self-identification
  (contact atomadic69@gmail.com / provider Atomadic Tech / resource atomadic.tech) before saving.
