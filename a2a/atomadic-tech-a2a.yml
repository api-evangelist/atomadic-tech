deviations:
- field: authentication / trialPolicy
  observed: top-level non-spec members (authentication.schemes [Bearer, APIKey, x402], trialPolicy)
  note: A2A 1.0.0 carries auth in securitySchemes/security; the card puts it in a custom `authentication` object and adds a `trialPolicy` object. Extra members are not a hard failure but a standard client will not read them.
- field: capabilities
  observed: x402Payment, freeTrial, freeTrialCallsPerEndpointPerDay alongside the spec members
  note: Vendor extensions inside capabilities without an `extensions[]` declaration.
- field: securitySchemes
  observed: absent
  note: No securitySchemes/security block despite the API requiring X-API-Key or an x402 proof on the endpoint the card names (GET /a2a answers 402).
- field: url
  observed: https://atomadic.tech/a2a answers 402 to an unpaid request
  note: Reachable and correctly advertised, but every A2A message costs 8000 micro-USDC (~$0.008); the card does not say so and an A2A client with no wallet cannot complete a handshake.
- field: description
  observed: '"146+ endpoints"'
  note: The published OpenAPI declares 149 operations, the live /v1/metrics says 119 endpoints, and the pricing manifest prices 89 paths of which 60 are absent from the contract. The number is marketing; the contract is the count.
