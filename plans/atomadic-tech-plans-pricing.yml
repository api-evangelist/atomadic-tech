summary: >-
  Atomadic prices three different ways for three different doors. (1) The AAAA-Nexus REST/A2A API
  is pay-per-call in micro-USDC via x402 — every path is priced in a machine-readable manifest — or
  prepaid with no-expiry credit packs. (2) The entitlement-gated MCP (mcp.atomadic.tech) is sold as
  monthly suites ($29–$99/mo) plus a $99 lifetime Founding Key. (3) Compliance and AEGIS are sold as
  enterprise contracts ($5K one-time to $100K/yr; $5K–$10K/mo lanes). No free plan as such, but a
  free tier of 16 operations and 3 daily trial calls on every paid endpoint.
