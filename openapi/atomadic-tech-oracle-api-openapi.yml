openapi: 3.2.0
info:
  title: AAAA Nexus Oracle API
  version: 0.5.1
  description: Formally verified AI safety APIs for autonomous agents. Supports REST, MCP, A2A (Google protocol), and x402 micropayment protocol.
  contact:
    email: atomadic69@gmail.com
    url: https://github.com/atomadictech/aaaa-nexus
servers:
- url: https://atomadic.tech
  description: Production
security: []
tags:
- name: Oracle
  description: Entropy oracle and hallucination detection
paths:
  /v1/oracle/entropy:
    get:
      operationId: getEntropyEpoch
      summary: Entropy epoch oracle
      description: Returns the current entropy epoch for zero-RTT A2A handshakes. No authentication required.
      tags:
      - Oracle
      responses:
        '200':
          description: Current entropy epoch
          content:
            application/json:
              schema:
                type: object
                properties:
                  epoch:
                    type: integer
                    example: 17409216
                  entropy:
                    type: string
                    example: a3f8c2...
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-04-09T12:00:00Z'
                  source:
                    type: string
                    example: quantum_ensemble
                  verified:
                    type: boolean
                    example: true
              example:
                epoch: 17409216
                entropy: a3f8c2...
                timestamp: '2026-04-09T12:00:00Z'
                source: quantum_ensemble
                verified: true
  /v1/rng/quantum:
    get:
      operationId: getQuantumRng
      summary: Quantum random number with proof
      description: Returns a verifiable quantum random value with cryptographic proof. No authentication required.
      tags:
      - Oracle
      responses:
        '200':
          description: Quantum random value
          content:
            application/json:
              schema:
                type: object
                properties:
                  random:
                    type: string
                    example: 0x7f3a8c2e9d1b4a6f...
                  bits:
                    type: integer
                    example: 256
                  source:
                    type: string
                    example: quantum
                  verified:
                    type: boolean
                    example: true
                  epoch:
                    type: integer
                    example: 17409216
              example:
                random: 0x7f3a8c2e9d1b4a6f...
                bits: 256
                source: quantum
                verified: true
                epoch: 17409216
  /v1/rng/verify:
    get:
      operationId: verifyRng
      summary: Verify current epoch random value
      description: Verify that the current epoch random value is valid and has not been tampered with.
      tags:
      - Oracle
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  epoch:
                    type: integer
                  valid:
                    type: boolean
                  proof:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
  /v1/oracle/hallucination:
    post:
      operationId: detectHallucination
      summary: Hallucination oracle
      description: Detect hallucinations with a certified upper bound. Returns a formally proved hallucination probability bound. Costs $0.002/call.
      tags:
      - Oracle
      security:
      - ApiKeyAuth: []
      - X402PaymentProof: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - claim
              properties:
                claim:
                  type: string
                  example: Water boils at 100Â°C at sea level
                context:
                  type: string
                  example: physics
      responses:
        '200':
          description: Hallucination analysis result
          content:
            application/json:
              schema:
                type: object
                properties:
                  claim:
                    type: string
                  context:
                    type: string
                  hallucination_bound:
                    type: number
                    format: float
                    example: 0.0012
                  verified:
                    type: boolean
                    example: true
                  proof_type:
                    type: string
                    example: formal
                  timestamp:
                    type: string
                    format: date-time
              example:
                claim: The capital of France is Paris
                context: geography
                hallucination_bound: 0.0012
                verified: true
                proof_type: formal
                timestamp: '2026-04-09T14:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
components:
  responses:
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Unauthorized
    BadRequest:
      description: Invalid request body or missing required fields.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    PaymentRequired:
      description: 'Payment required. Use x402 protocol: send USDC on Base L2, Polygon, or Solana to the treasury address provided in the response, then retry with the X-Payment-Proof header.'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Payment required
              amount:
                type: string
                example: '0.002'
              currency:
                type: string
                example: USDC
              treasury:
                type: string
                description: Destination wallet address
              chains:
                type: array
                items:
                  type: string
                example:
                - base
                - polygon
                - solana
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key obtained from https://atomadic.tech/pay
    X402PaymentProof:
      type: apiKey
      in: header
      name: X-Payment-Proof
      description: Base64-encoded USDC payment proof for x402 autonomous payment flow (Base L2, Polygon, or Solana)
    AdminTokenAuth:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Admin token for privileged operations
